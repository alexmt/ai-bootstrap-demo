apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: qa
  namespace: rollouts-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: rollouts-demo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: rollouts-demo-qa
                sources:
                  - repoURL: https://github.com/alexmt/ai-bootstrap-demo.git
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("argoproj/rollouts-demo").Tag }}
  verification:
    analysisTemplates:
      - name: smoke-test
    args:
      - name: url
        value: http://rollouts-demo.rollouts-demo-qa.svc
      - name: color
        value: ${{ imageFrom("argoproj/rollouts-demo").Tag }}
---
